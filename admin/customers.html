<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory | Yankiii Barber Co. Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="admin-body">

    <!-- ================= SIDEBAR ================= -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-brand">
            <a href="dashboard.html" class="logo">
                YANKIII <span>ADMIN</span>
            </a>
            <button class="modal-close" style="color:#b5c0b0; display:none;" id="sidebarCloseBtn" onclick="toggleSidebar()">&times;</button>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="bookings.html"><i class="fa-regular fa-calendar-check"></i> Bookings</a>
            <a href="services.html"><i class="fa-solid fa-scissors"></i> Services</a>
            <a href="barbers.html"><i class="fa-solid fa-user-tie"></i> Barbers</a>
            <a href="customers.html" class="active"><i class="fa-solid fa-users"></i> Customers</a>
            <a href="settings.html"><i class="fa-solid fa-clock"></i> Business Hours</a>
        </nav>

        <div class="admin-nav-footer">
            <a href="../index.html" target="_blank" style="display: flex; align-items: center; gap: 8px; color: #b5c0b0; font-size: 13px; margin-bottom: 12px;">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View Live Website
            </a>
            <button type="button" onclick="logoutAdmin()" class="btn btn-sm btn-outline btn-block" style="border-color:#465143;color:#e6f4e6;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <button type="button" class="admin-toggle-btn" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 style="font-size: 18px; font-weight: 700;">Customer Directory</h2>
            </div>
            <div class="admin-topbar-right">
                <span id="customerCountBadge" class="badge badge-confirmed">Loading...</span>
            </div>
        </header>

        <main class="admin-content-body">
            <div class="data-panel">
                <div class="data-panel-header">
                    <h3>Registered Clients</h3>
                    <input type="text" id="customerSearchInput" class="table-search-input" placeholder="Search customer name, email, phone..." oninput="filterCustomersTable()">
                </div>

                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client Name</th>
                                <th>Email Address</th>
                                <th>Phone Number</th>
                                <th>Role</th>
                                <th>Total Appointments</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody id="customersTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 30px; color: #65705f;">
                                    <i class="fa-solid fa-spinner fa-spin"></i> Loading customer directory...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initCustomersPage();
        });
    </script>
</body>

</html>
