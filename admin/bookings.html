<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings | Yankiii Barber Co. Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="admin-body">

    <!-- ================= SIDEBAR ================= -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-brand">
            <a href="dashboard.html" class="logo">
                YANKIII <span>ADMIN</span>
            </a>
            <button class="modal-close" style="color:#b5c0b0; display:none;" id="sidebarCloseBtn" onclick="toggleSidebar()">&times;</button>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="bookings.html" class="active"><i class="fa-regular fa-calendar-check"></i> Bookings</a>
            <a href="services.html"><i class="fa-solid fa-scissors"></i> Services</a>
            <a href="barbers.html"><i class="fa-solid fa-user-tie"></i> Barbers</a>
            <a href="customers.html"><i class="fa-solid fa-users"></i> Customers</a>
            <a href="settings.html"><i class="fa-solid fa-clock"></i> Business Hours</a>
        </nav>

        <div class="admin-nav-footer">
            <a href="../index.html" target="_blank" style="display: flex; align-items: center; gap: 8px; color: #b5c0b0; font-size: 13px; margin-bottom: 12px;">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View Live Website
            </a>
            <button type="button" onclick="logoutAdmin()" class="btn btn-sm btn-outline btn-block" style="border-color:#465143;color:#e6f4e6;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <button type="button" class="admin-toggle-btn" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 style="font-size: 18px; font-weight: 700;">Appointment Bookings</h2>
            </div>
            <div class="admin-topbar-right">
                <span id="bookingCountBadge" class="badge badge-confirmed">Loading...</span>
            </div>
        </header>

        <main class="admin-content-body">
            <div class="data-panel">
                <div class="data-panel-header">
                    <h3>All Appointments</h3>
                    <div class="table-toolbar">
                        <input type="text" id="bookingSearchInput" class="table-search-input" placeholder="Search reference, customer, barber..." oninput="filterBookingsTable()">
                        <select id="bookingStatusFilter" class="table-filter-select" onchange="filterBookingsTable()">
                            <option value="all">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Ref Code</th>
                                <th>Customer & Contact</th>
                                <th>Service & Duration</th>
                                <th>Barber</th>
                                <th>Appointment Date</th>
                                <th>Time</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody">
                            <tr>
                                <td colspan="9" style="text-align: center; padding: 30px; color: #65705f;">
                                    <i class="fa-solid fa-spinner fa-spin"></i> Loading bookings...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- View Booking Details / Notes Modal -->
    <div class="modal-backdrop" id="bookingDetailsModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Booking Details</h3>
                <button type="button" class="modal-close" onclick="closeDetailsModal()">&times;</button>
            </div>
            <div class="modal-body" id="bookingDetailsBody">
                <!-- Dynamically filled -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary btn-sm" onclick="closeDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initBookingsPage();
        });
    </script>
</body>

</html>
