<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Yankiii Barber Co.</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #f7f5f2;
        }

        .reset-card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .reset-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-logo h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .reset-logo p {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .reset-header {
            margin-bottom: 25px;
        }

        .reset-header h2 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .reset-header p {
            margin: 0;
            color: #777;
            line-height: 1.6;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding: 13px 50px 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: 0.2s ease;
        }

        .password-wrapper input:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .password-requirements {
            margin-top: 8px;
            color: #777;
            font-size: 12px;
        }

        .reset-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #111;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .reset-btn:hover {
            background: #333;
        }

        .reset-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #eaf7ee;
            color: #176b35;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #a52828;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: #111;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .reset-page {
                padding: 20px 15px;
            }

            .reset-card {
                padding: 30px 22px;
                border-radius: 14px;
            }

            .reset-logo h1 {
                font-size: 24px;
            }

            .reset-header h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="reset-page">

        <section class="reset-card">

            <div class="reset-logo">
                <h1>Yankiii Barber Co.</h1>
                <p>Barbering & Grooming</p>
            </div>

            <div class="reset-header">
                <h2>Create New Password</h2>

                <p>
                    Your verification code has been confirmed.
                    Create a new password for your account.
                </p>
            </div>

            <div id="message" class="message"></div>

            <form id="resetPasswordForm">

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleNewPassword"
                        >
                            Show
                        </button>

                    </div>

                    <div class="password-requirements">
                        Password must be at least 6 characters.
                    </div>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your new password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleConfirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="reset-btn"
                    id="resetBtn"
                >
                    Reset Password
                </button>

            </form>

            <div class="back-login">
                <a href="login">
                    ← Back to Login
                </a>
            </div>

        </section>

    </main>

    <script>
        const email = sessionStorage.getItem('passwordResetEmail');
        const resetToken = sessionStorage.getItem('passwordResetToken');

        const form = document.getElementById('resetPasswordForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');
        const message = document.getElementById('message');

        // Make sure the user completed the previous steps
        if (!email || !resetToken) {
            window.location.href = 'forgot-password';
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function setupPasswordToggle(buttonId, inputId) {
            const button = document.getElementById(buttonId);
            const input = document.getElementById(inputId);

            button.addEventListener('click', () => {

                if (input.type === 'password') {
                    input.type = 'text';
                    button.textContent = 'Hide';
                } else {
                    input.type = 'password';
                    button.textContent = 'Show';
                }

            });
        }

        setupPasswordToggle(
            'toggleNewPassword',
            'newPassword'
        );

        setupPasswordToggle(
            'toggleConfirmPassword',
            'confirmPassword'
        );

        form.addEventListener('submit', async (event) => {

            event.preventDefault();

            const password = newPassword.value;
            const confirmation = confirmPassword.value;

            if (password.length < 8 || password.length > 128 || !/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/\d/.test(password)) {
                showMessage(
                    'Use 8 to 128 characters, including uppercase, lowercase, and a number.',
                    'error'
                );
                return;
            }

            if (password !== confirmation) {
                showMessage(
                    'Passwords do not match.',
                    'error'
                );
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            message.className = 'message';

            try {

                const response = await fetch(
                    '/api/auth/reset-password',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email,
                            resetToken,
                            newPassword: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok && data.success) {

                    showMessage(
                        'Your password has been reset successfully. Redirecting to login...',
                        'success'
                    );

                    // Remove reset information from browser storage
                    sessionStorage.removeItem(
                        'passwordResetEmail'
                    );

                    sessionStorage.removeItem(
                        'passwordResetToken'
                    );

                    setTimeout(() => {
                        window.location.href = 'login';
                    }, 1800);

                    return;
                }

                showMessage(
                    data.message ||
                    'Unable to reset your password.',
                    'error'
                );

            } catch (error) {

                console.error(
                    'Reset password error:',
                    error
                );

                showMessage(
                    'Unable to connect to the server. Please try again.',
                    'error'
                );

            } finally {

                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';

            }

        });
    </script>

    <script src="/js/cookie-consent.js"></script>
</body>
</html>
