<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Yankiii Barber Co.</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .forgot-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #f7f5f2;
        }

        .forgot-card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .forgot-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-logo h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .forgot-logo p {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .forgot-header {
            margin-bottom: 25px;
        }

        .forgot-header h2 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .forgot-header p {
            margin: 0;
            color: #777;
            line-height: 1.6;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .forgot-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #111;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .forgot-btn:hover {
            background: #333;
        }

        .forgot-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #eaf7ee;
            color: #176b35;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #a52828;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: #111;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .forgot-page {
                padding: 20px 15px;
            }

            .forgot-card {
                padding: 30px 22px;
                border-radius: 14px;
            }

            .forgot-logo h1 {
                font-size: 24px;
            }

            .forgot-header h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="forgot-page">

        <section class="forgot-card">

            <div class="forgot-logo">
                <h1>Yankiii Barber Co.</h1>
                <p>Barbering & Grooming</p>
            </div>

            <div class="forgot-header">
                <h2>Forgot Password?</h2>
                <p>
                    Enter the email address connected to your account.
                    We'll send you a verification code to reset your password.
                </p>
            </div>

            <div id="message" class="message"></div>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="forgot-btn"
                    id="submitBtn"
                >
                    Send Verification Code
                </button>

            </form>

            <div class="back-login">
                <a href="login.html">← Back to Login</a>
            </div>

        </section>

    </main>

    <script>
        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage('Please enter your email address.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            message.className = 'message';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {

                    sessionStorage.setItem(
                        'passwordResetEmail',
                        email
                    );

                    window.location.href =
                        'verify-reset-code.html';

                    return;
                }

                showMessage(
                    data.message ||
                    'Something went wrong. Please try again.',
                    'error'
                );

            } catch (error) {

                console.error('Forgot password error:', error);

                showMessage(
                    'Unable to connect to the server. Please try again.',
                    'error'
                );

            } finally {

                submitBtn.disabled = false;
                submitBtn.textContent =
                    'Send Verification Code';
            }
        });
    </script>

</body>
</html>
