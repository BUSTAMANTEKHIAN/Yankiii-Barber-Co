<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Yankiii Barber Co.</title>
    <meta name="description" content="Register an account with Yankiii Barber Co. for one-click bookings, appointment history, and direct barber notifications.">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <header class="header">
        <div class="container nav-container">
        <a href="index.html" class="logo">
            <img src="assets\logo\logo.png" alt="Yankiii Barber Co.">
        </a>

            <nav class="navbar" id="navbar">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="barbers.html">Barbers</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="booking.html" class="nav-book">Book Now</a>
            </nav>

            <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card" style="max-width: 480px;">
            <div class="auth-header">
                <span class="eyebrow">JOIN YANKIII</span>
                <h1>Create Account</h1>
                <p>Enjoy faster bookings and appointment management.</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name *</label>
                    <input type="text" id="regName" class="form-control" placeholder="e.g. Mateo Gonzales" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address *</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPhone">Phone Number *</label>
                    <input type="tel" id="regPhone" class="form-control" placeholder="0912 345 6789" required autocomplete="tel">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password *</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                    Create Account <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <div class="container footer-bottom" style="border-top:none;">
            <p>© 2026 Yankiii Barber Co. All rights reserved.</p>
            <p>Designed & Developed by Khian</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
